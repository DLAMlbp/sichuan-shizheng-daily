name: Update and publish daily reading
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Beijing 20:15, 20:45, 21:15, 21:45; scheduling may be delayed by GitHub.
    - cron: '15,45 12,13 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync public daily editions
        id: sync
        continue-on-error: true
        run: node sync.mjs
      - name: Keep dated editions in source history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- *.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh archived daily editions"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
          retention-days: 1
      - name: Deploy reading page
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report unavailable source without removing the previous reading copy
        if: steps.sync.outcome == 'failure'
        run: |
          echo '::error::The saved reading copy was deployed, but new daily content could not be fetched. Check the origin access before claiming this mirror is up to date.'
          exit 1
